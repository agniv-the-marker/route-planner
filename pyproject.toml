[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "route-sculptor"
version = "0.2.0"
description = "Turn a shape into a bicycle street loop in San Francisco"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.10,<7", "numpy>=1.26,<3", "scipy>=1.11,<2",
    "Pillow>=10,<13", "opencv-python-headless>=4.10,<5", "gpxpy>=1.6,<2", "modal>=1.3,<2",
    "networkx>=3.2,<4", "osmnx>=2.1,<3", "pyproj>=3.6,<4", "shapely>=2,<3",
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "svgpathtools==1.7.1",
    "httpx>=0.27,<1",
]
modal = [
    "modal>=1.3,<2",
]

[project.scripts]
route-sculptor = "src.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
src = ["assets/*.css", "assets/*.js", "assets/*.html", "assets/*.json", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
