# Route Sculptor — Default Configuration

# Image generation
image_gen:
  model_id: "runwayml/stable-diffusion-v1-5"
  prompt_template: "black silhouette of a single {concept}, solid black shape, pure white background, simple flat icon, minimal, centered, one object only"
  negative_prompt: "circle around, encircled, ring, border, frame, multiple, two, many, pair, group, pattern, texture, ornate, decorated, background, scenery, environment, water, ocean, sky, ground, grass, nature, landscape, 3d, realistic, photo, detailed, complex, lines, sketch, hatching, shading, gradient, gray, person, human, hands, text, watermark, color, noise, blurry"
  image_size: 512
  num_inference_steps: 30  # 30 steps needed for clean silhouettes (use GPU/Modal)
  guidance_scale: 8.0  # 8 is sweet spot for SD 1.5 silhouettes (10+ causes artifacts)
  use_controlnet: true
  controlnet_model: "lllyasviel/control_v11p_sd15_canny"
  controlnet_scale: 0.1  # gentle bias toward road grid (0.5 was too strong)

# Edge detection
edge_detect:
  canny_low: 50
  canny_high: 150
  blur_kernel: 5  # Gaussian blur before Canny

# Placement grid search
placement:
  num_positions: 25  # 5x5 grid across SF (was 10 = 3x3)
  num_scales: 5
  num_rotations: 8
  scale_range_km: [0.3, 5.0]  # min/max footprint in km
  max_rotation_deg: 15  # ±15° keeps shapes upright with minimal tilt

# Waypoint sampling
waypoints:
  num_points: 80  # more points help preserve sharp features
  curvature_weight: 2.0  # bias toward high-curvature areas (0 = uniform)
  max_gap_km: 0.15  # densify: max 150m between waypoints so router follows roads

# Multi-contour (include internal details like eyes, windows)
multi_contour:
  enabled: true
  min_inner_area_ratio: 0.005  # minimum inner contour area as fraction of outer
  max_inner_contours: 5
  outer_budget_min: 0.6  # minimum fraction of waypoint budget for outer
  min_inner_waypoints: 4

# San Francisco bounding box (full city, graph excludes water routes)
sf_bbox:
  min_lat: 37.7100
  max_lat: 37.7950    # avoid waterfront/bay
  min_lon: -122.5100
  max_lon: -122.3800

# Routing (Valhalla is default, OSRM as fallback)
routing:
  backend: "graph"  # "graph" (local, instant) or "valhalla" (API, slow) or "osrm"
  graph_path: "data/sf_bike_graph.graphml"
  valhalla_url: "https://valhalla1.openstreetmap.de"
  valhalla_costing: "bicycle"
  osrm_url: "https://router.project-osrm.org"
  osrm_profile: "driving"
  request_delay: 1.0
  parallel: true
  max_concurrent: 10

# Evaluation
evaluation:
  clip_model: "openai/clip-vit-base-patch32"
  clip_prompt_template: "a GPS bike route on a map that traces the outline of a {concept}"
  reward_clip_weight: 1.0
  reward_chamfer_weight: 0.0
  render_size: 512

# DDPO training
training:
  num_epochs: 100
  batch_size: 4
  learning_rate: 1.0e-5
  num_samples_per_concept: 4
  save_every: 10  # save checkpoint every N epochs

# Logging
logging:
  wandb_project: "route-sculptor"
  wandb_entity: null  # set to your W&B username/team

# Inference
inference:
  checkpoint: null  # path to trained checkpoint, null = base model
  gradio_port: 7860
